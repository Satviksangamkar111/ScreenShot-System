<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fixture Workspace</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    #login { max-width: 320px; }
    #app { display: none; }
    input { display: block; margin: 8px 0; padding: 6px; width: 100%; box-sizing: border-box; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>
  <div id="login">
    <h2>Sign In</h2>
    <label>Username <input id="user" type="text" /></label>
    <label>Password <input id="pass" type="password" /></label>
    <button id="signin">Sign In</button>
  </div>
  <div id="app">
    <h2>Fixture Workspace</h2>
    <p>You are signed in.</p>
    <input id="companyCode" type="text" placeholder="Company Code" />
  </div>
  <script>
    function hasSessionCookie() {
      return document.cookie.split(';').some(function (c) {
        return c.trim().indexOf('fixture_session=ok') === 0;
      });
    }
    function render() {
      if (hasSessionCookie()) {
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'block';
      } else {
        document.getElementById('login').style.display = 'block';
        document.getElementById('app').style.display = 'none';
      }
    }
    document.getElementById('signin').addEventListener('click', function () {
      document.cookie = 'fixture_session=ok; path=/';
      render();
    });
    render();
  </script>
</body>
</html>
