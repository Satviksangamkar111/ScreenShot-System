# Canonical label normalisation.
#
# Two independent traversals (old and new) must converge on identical labels for
# fields that did not actually change. Keys are raw labels lowercased with
# whitespace collapsed and trailing punctuation (":" / "*") stripped; values are
# the canonical form written into the document.
#
# Seeded from the vocabulary observed in the reference documents.

canonical:
  # Organisational codes
  company code: Company Code
  companycode: Company Code
  sales office code: Sales Office Code
  sales office: Sales Office
  sales organization: Sales Organization
  cost center code: Cost Center Code
  plant code: Plant Code
  delivery plant: Delivery Plant
  bottler code: Bottler Code
  bottler account: Bottler Account
  bp group: BP Group
  account group: Account Group
  trade group: Trade Group
  senden group: Senden Group

